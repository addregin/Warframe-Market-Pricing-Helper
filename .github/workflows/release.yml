name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt curl_cffi

      - name: Build the program
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Warframe Market Prices"
          --icon wfm_icon.ico --version-file wfm_version.txt
          --add-data "wfm_icon.ico;."
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebChannel
          --collect-all curl_cffi
          wfm_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "installer\Warframe Market Prices Setup.exe")) { throw "installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Warframe Market Prices Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Warframe Market Prices Setup.exe
          generate_release_notes: true
